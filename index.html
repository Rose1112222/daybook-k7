<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.nal.usda.gov; media-src 'self' blob: mediastream:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F0F0F0; --surface:#FFFFFF; --ink:#1E1E1E; --muted:#6F6F6F; --line:#E5E5E5; --track:#D8D8D8;
  --accent:#E2832B; --accent-ink:#161616; --accent-soft:#FBE4CE; --accent-text:#B25A0A;
  --good:#2F9E24; --over:#D43D35; color-scheme:light;
  --protein:#4A86E8; --carbs:#EDAA16; --fat:#DB4F87;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1B1B1B; --ink:#F1F1F1; --muted:#A3A3A3; --line:#2D2D2D; --track:#4A4A4A;
    --accent:#E2832B; --accent-ink:#141414; --accent-soft:#3B2A1B; --accent-text:#F0963F;
    --good:#41B42F; --over:#FF6B62; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1B1B1B; --ink:#F1F1F1; --muted:#A3A3A3; --line:#2D2D2D; --track:#4A4A4A;
  --accent:#E2832B; --accent-ink:#141414; --accent-soft:#3B2A1B; --accent-text:#F0963F;
  --good:#41B42F; --over:#FF6B62; color-scheme:dark;
}
:root{--ovb:light-dark(#2F6FD0,#6FA8FF)}
:root[data-ovb="purple"]{--ovb:light-dark(#7A4FD0,#B79BFF)}
:root[data-ovb="teal"]{--ovb:light-dark(#0F7F86,#4FC9D0)}
:root[data-ovb="amber"]{--ovb:light-dark(#A86A00,#F2B84B)}
:root[data-ovb="pink"]{--ovb:light-dark(#C2378A,#FF8CCB)}
:root[data-ovb="gray"]{--ovb:light-dark(#6A6A6A,#C4C4C4)}
:root[data-ovb="red"]{--ovb:var(--over)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 10px 96px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 10px}
.round{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent-text);position:relative;overflow:hidden;flex:none}
.round input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.datenav{display:flex;align-items:center}
.nav{width:40px;height:44px;display:grid;place-items:center;border-radius:50%}
.datebtn{font-size:25px;padding:2px 6px;border-radius:8px;white-space:nowrap}
.status{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.status.bad{color:var(--over);font-weight:700}
.h1{font-size:25px;font-weight:700;margin:18px 6px 12px}

/* cards */
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:10px}
.card h2{font-size:17px;font-weight:700;margin:0 0 10px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

/* budget */
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .bhead h2{font-size:22px;margin:0}
.gear{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%;flex:none}
.brow{display:grid;grid-template-columns:1fr 128px 1fr;align-items:center;margin:10px 0 4px}
.bcol{text-align:center;display:block;border-radius:12px;padding:4px 0}
.bcol span{display:block;font-size:19px}
.bcol b{display:block;font-size:29px;font-weight:400}
.gwrap{position:relative}
.gauge{width:100%;display:block}
.gtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:8px}
.gtxt b{font-size:27px;font-weight:400;color:var(--good);line-height:1.1}
.gtxt.over b{color:var(--ovb)}
.gtxt span{font-size:17px}
.macros{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.macro{flex:1;font-size:13px;color:var(--muted);text-align:center}
.macro b{display:block;font-size:17px;color:var(--ink);font-weight:500}
.macro em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.split{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:10px}
.split i{display:block;height:100%}

/* meals */
.meal{background:var(--surface);border-radius:16px;margin-bottom:10px;overflow:hidden}
.meal-head{display:flex;align-items:center;padding:8px 6px 2px 8px}
.mtoggle{flex:1;display:flex;align-items:center;gap:8px;text-align:left;font-size:21px;font-weight:700;padding:8px 6px;border-radius:10px;min-width:0}
.mtoggle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtoggle svg{flex:none;transition:transform .15s}
.mtoggle[aria-expanded="false"] svg{transform:rotate(180deg)}
.dots{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%;flex:none}
.erow{display:flex;align-items:center;padding-left:10px}
.chk{width:44px;height:48px;display:grid;place-items:center;flex:none;color:var(--muted);border-radius:50%}
.erow:not(.done) .en,.erow:not(.done) .ek{color:var(--muted)}
.erow:not(.done) .eg{opacity:.7}
.entry{display:grid;grid-template-columns:1fr auto;gap:0 12px;flex:1;min-width:0;text-align:left;padding:7px 18px 7px 4px}
.entry:hover{background:var(--bg)}
.entry .en{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .ek{font-size:18px;grid-row:span 2;padding-top:2px}
.entry .eg{font-size:16px;color:var(--muted)}
.meal-actions{display:flex;justify-content:flex-end;padding:8px 16px 16px}
.pill{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:12px 26px;border-radius:99px}
.link{color:var(--accent-text);font-weight:700;padding:8px 10px;border-radius:10px}
.link:hover{background:var(--accent-soft)}
.link.quiet{color:var(--muted);font-weight:500}

/* buttons, fields */
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 16px;border-radius:99px;font-size:16px;text-align:center}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--over);border:1px solid var(--line)}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}
label.f{display:block;margin-bottom:12px}
label.f span, .flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.in.big{font-size:28px;font-weight:500;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted);background:var(--surface)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* lists */
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:var(--bg)}
.item .a{min-width:0}
.item .a b{display:block;font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a span{font-size:13px;color:var(--muted)}
.item .b{white-space:nowrap}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:520px;margin:0 auto;display:flex}
.tab{flex:1;padding:8px 0 8px;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .ic{padding:4px 18px;border-radius:99px;display:grid}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-text);font-weight:700}
.tab.on .ic{background:var(--accent-soft)}

/* full-screen sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{max-width:520px;margin:0 auto;padding:0 14px 28px}
.sheet-top{display:flex;align-items:center;gap:8px;padding:10px 0 12px;position:sticky;top:0;background:var(--bg);z-index:1}
.sheet-top h1{font-size:19px;font-weight:700;margin:0;flex:1;text-align:center;padding-right:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-top .link{width:60px;text-align:left}
.preview{text-align:center;margin:14px 0 18px}
.preview b{font-size:40px;font-weight:500;display:block;line-height:1.1}
.preview span{color:var(--muted);font-size:14px}
.stack > * + *{margin-top:10px}

/* amount screen */
.fhead{display:flex;align-items:center;gap:6px;padding:14px 0 10px}
.fname{flex:1;min-width:0}
.fname b{display:block;font-size:22px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.fname span{display:block;font-size:19px;margin-top:2px}
.savebtn{color:var(--accent-text);font-weight:700;font-size:22px;padding:8px 6px 8px 10px;border-radius:10px;flex:none}
.ftitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 2px 8px}
.ftitle h2{font-size:24px;font-weight:400;margin:0;white-space:nowrap}
.ftitle .link{font-size:17px;white-space:nowrap;padding:8px 4px}
.card.facts{padding:0 18px 16px}
.famt{display:flex;justify-content:space-between;gap:10px;font-size:22px;padding:16px 0 12px;border-bottom:1px solid var(--ink)}
.fbody{display:grid;grid-template-columns:1fr 1.3fr;align-items:center;gap:12px;padding-top:12px}
.fcal{text-align:center}
.fcal b{display:block;font-size:52px;font-weight:700;line-height:1}
.fcal span{color:var(--muted);font-size:20px}
.fnut div{display:flex;justify-content:space-between;gap:10px;font-size:18px;line-height:1.5}
.fnut .nb{font-weight:700}
.fnut .ns{color:var(--muted);padding-left:16px}
.amtbar{display:flex;gap:16px;align-items:flex-end;margin-top:14px;padding:0 4px}
.amt{flex:0 0 36%;min-width:0;background:none;border:0;border-bottom:2px solid var(--accent);font-size:28px;text-align:center;padding:8px 4px;border-radius:0}
.amt:focus{outline:none;border-bottom-width:4px}
.unit{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:0;border-bottom:1px solid var(--muted);font:inherit;font-size:24px;padding:10px 2px;border-radius:0}

.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 4px 0}
.sec-head h2{font-size:17px;font-weight:700;margin:0}

.wchg{font-size:46px;font-weight:700;text-align:center;line-height:1.1;margin-top:12px}
.wchg.down{color:var(--good)}

.wk{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:end}
.wkt b{color:var(--ink);font-weight:700;font-size:24px}
.wkt span{font-size:20px}
.wkc{text-align:center;font-size:20px;margin-top:2px}
.wbars{display:flex;gap:6px;align-items:flex-end}
.wbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;border-radius:8px;padding-top:2px}
.wtrack{position:relative;display:block;width:100%;max-width:24px;height:138px;border-radius:7px;background:var(--track);overflow:hidden}
.wtrack i{position:absolute;left:0;right:0;display:block}
.wfill{bottom:0;background:var(--good)}
.wfill.dim{opacity:.5}
.wover{background:var(--ovb)}
.wline{height:2px;background:var(--surface)}
.wname{font-size:17px;color:var(--muted)}
.wbar.on .wname{color:var(--ink);font-weight:700}
.wsum{text-align:center;font-size:19px;margin:16px 0 2px}

.finish{margin:18px 4px 8px;text-align:center}
.rollrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-size:15px;color:var(--muted)}
.rollrow .in{width:auto;padding:8px 10px;font-size:16px}

.calhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px;border-top:1px solid var(--line);padding-top:10px}
.calhead b{font-size:18px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cday{aspect-ratio:1/1.1;border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0}
.cday i{font-style:normal;font-size:11px;color:var(--muted);line-height:1}
.cday b{font-size:13px;font-weight:500;line-height:1.2;min-height:16px}
.cday.now{box-shadow:inset 0 0 0 2px var(--accent)}
.cday:disabled{opacity:.35;cursor:default}

.lsep{padding:12px 16px 6px;font-size:13px;font-weight:700;color:var(--muted);border-top:1px solid var(--line)}
.lsep:first-child{border-top:0}
.searchrow{display:flex;gap:8px}
.searchrow .in{flex:1;min-width:0}
.scanbtn{flex:none;width:52px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.scanbox{border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;z-index:20;pointer-events:none}
@media (prefers-reduced-motion: reduce){ .mtoggle svg{transition:none} }
</style>
</head>

<div id="app" class="wrap"></div>

<div id="sheet"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/*
  Tally: a personal calorie log. One file, no libraries, no build step.
  Map of this script, in order:
    helpers ............ small formatting and date functions; clockDay()/today() implement the day rollover
    state (S) .......... everything in memory
    storage (Store) .... three back ends behind one interface: Claude viewer db, IndexedDB (installed app), localStorage (fallback)
    data access ........ months, foods, batches, weights; every change goes through a save*() function
    boot ............... loads settings first, then the rest
    render: ............ one function per tab (log, foods, trends, settings) returning HTML strings; all text passes through esc()
    sheets ............. full-screen panels (add food, amount, food form, batch, budget, weight, TDEE, scan)
    barcodes ........... camera scanning and the USDA branded lookup (installed app only)
    actions (A) ........ every tap is a data-act attribute handled here
    events ............. click/input/change delegation at the bottom
  The stored data format is described in DATA-FORMAT.md. Never change the meaning of an existing field; add new ones.
*/

/* True when the page runs on its own web address (the installed phone app); false inside the Claude viewer or from a file. */
var STANDALONE = !(window.claude && typeof window.claude.use === 'function') && /^https?:$/.test(location.protocol);

/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ return Math.round(n || 0).toLocaleString(); }
function r1(n){ return Math.round((n || 0) * 10) / 10; }
function num(v){ var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function ds(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function pd(s){ var a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function addDays(s, n){ var d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
/* the log day changes at the rollover hour (default 6 am), or earlier when the day is marked finished */
function clockDay(){ var d = new Date(), r = S.settings.roll; d.setHours(d.getHours() - (r != null ? r : 6)); return ds(d); }
function today(){ var c = clockDay(), f = S.settings.fin; return f && f >= c ? addDays(f, 1) : c; }
var OVB = [['blue', 'Blue', '#4C8FE8'], ['purple', 'Purple', '#9A77E6'], ['teal', 'Teal', '#2FA9B0'], ['amber', 'Amber', '#D9982A'], ['pink', 'Pink', '#E062AB'], ['gray', 'Gray', '#9A9A9A'], ['red', 'Red', '#E5554E']];
function applyOvb(){ document.documentElement.setAttribute('data-ovb', 'red'); }
function hourText(h){ return h === 0 ? '12 am' : h < 12 ? h + ' am' : h === 12 ? '12 pm' : (h - 12) + ' pm'; }
function ym(s){ return s.slice(0, 7); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function gramsText(g){ return (Math.round(g * 10) / 10) + ' g'; }

var DEFAULT_MEALS = ['Breakfast', 'Lunch', 'Dinner'];
var OLD_MEALS = ['Breakfast', 'Pre-work snack', 'Work break', 'Lunch', 'Dinner'], OLD_MAP = [0, 0, 1, 1, 2];
function newMonth(){ return { days: {}, v: 2 }; }

/* units: grams or milliliters are the base; everything else converts to it */
var UNITS = { g: ['Grams', 1], oz: ['Ounces', 28.3495], lb: ['Pounds', 453.592], ml: ['Milliliters', 1], floz: ['Fluid ounces', 29.5735], tbsp: ['Tablespoons', 14.7868], cup: ['Cups', 236.588] };
var NK = ['k', 'p', 'c', 'f', 'sf', 'ch', 'na', 'fi', 'su'];
var NUTS = [['f', 'Total Fat', 'g', 1], ['sf', 'Sat Fat', 'g', 0], ['ch', 'Cholesterol', 'mg', 1], ['na', 'Sodium', 'mg', 1], ['c', 'Total Carbs', 'g', 1], ['fi', 'Fiber', 'g', 0], ['su', 'Sugars', 'g', 0], ['p', 'Protein', 'g', 1]];
function r2(n){ return Math.round((n || 0) * 100) / 100; }
function unitsFor(src){ var l = src.un === 'ml' ? ['ml', 'floz', 'tbsp', 'cup'] : ['g', 'oz', 'lb']; if (src.sv) l.unshift('sv'); return l; }
function unitName(code, src){ return code === 'sv' ? (src.sn || 'Servings') : UNITS[code][0]; }
function toBase(q, code, src){ return code === 'sv' ? q * src.sv : q * UNITS[code][1]; }
function amountText(e){
  if (e.g == null) return 'Quick add';
  if (e.qu) return r2(e.q) + ' ' + (e.qu === 'sv' ? (e.qn || 'Servings') : UNITS[e.qu][0]);
  return r1(e.g) + ' ' + UNITS[e.un === 'ml' ? 'ml' : 'g'][0];
}
function setQty(e, q, qu, src){
  if (qu && qu !== (e.un || 'g')) { e.q = r2(q); e.qu = qu; if (qu === 'sv' && src.sn) e.qn = src.sn; else delete e.qn; }
  else { delete e.q; delete e.qu; delete e.qn; }
}

var S = {
  ready: false, error: null, tab: 'today', date: ds(new Date()), cur: null,
  settings: { budget: null, meals: DEFAULT_MEALS.slice(), unit: 'lb' },
  foods: {},      // id -> {n, k, p, c, f, lg, u}   (k/p/c/f are per 100 g)
  months: {},     // 'YYYY-MM' -> {days: {date: [entry]}}
  weights: {},    // date -> number
  sheet: null, batches: {}, pots: [], draft: null, collapsed: {}, wper: 'm', calm: null, foodQuery: '', downloads: null,
  saveState: 'idle', lastLoad: 0

/* ---------- storage ---------- */
var Store = {
  mode: 'starting', col: null, pending: {}, timers: {}, busy: {}, failed: {},
  init: async function(){
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        var got = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        var id = got[1] ? await got[1].id() : null;
        if (got[0] && id) { this.col = got[0].collection('data/users/' + id); this.mode = 'cloud'; return; }
      }
    } catch (e) {}
    if (STANDALONE && window.indexedDB) {
      try { this.idb = await this.idbOpen(); this.mode = 'idb'; if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); return; } catch (e) {}
    }
    this.mode = 'local';
  },
  idbOpen: function(){
    return new Promise(function(res, rej){
      var r = indexedDB.open('tally', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('docs'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };

  },
  idbRun: function(mode, fn){
    var self = this;
    return new Promise(function(res, rej){
      var tx = self.idb.transaction('docs', mode), req = fn(tx.objectStore('docs'));
      tx.oncomplete = function(){ res(req ? req.result : undefined); };

  load: async function(name){
    if (this.mode === 'cloud') {
      var s = await this.col.doc(name).get();
      return s.exists ? clone(s.data()) : null;
    }
    if (this.mode === 'idb') { var got = await this.idbRun('readonly', function(st){ return st.get(name); }); return got == null ? null : got; }

  },
  loadAll: async function(){
    var out = {};
    if (this.mode === 'cloud') {
      var q = await this.col.limit(1000).get();
      q.docs.forEach(function(d){ out[d.id] = clone(d.data()); });
    } else if (this.mode === 'idb') {
      var keys = await this.idbRun('readonly', function(st){ return st.getAllKeys(); });
      var vals = await this.idbRun('readonly', function(st){ return st.getAll(); });
      keys.forEach(function(k, i){ out[k] = vals[i]; });
    } else {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('tally:') === 0) out[k.slice(6)] = JSON.parse(localStorage.getItem(k));
        }
      } catch (e) {}
    }
    return out;
  },
  eraseAll: async function(){

    Object.keys(this.timers).forEach(function(n){ clearTimeout(self.timers[n]); });

      await this.idbRun('readwrite', function(st){ return st.clear(); });

      var keys = [];
      for (var j = 0; j < localStorage.length; j++) { var k = localStorage.key(j); if (k && k.indexOf('tally:') === 0) keys.push(k); }

    }
  },
  write: async function(name, data){
    if (this.mode === 'cloud') { await this.col.doc(name).set(data); return; }
    if (this.mode === 'idb') { await this.idbRun('readwrite', function(st){ return st.put(data, name); }); return; }

  },
  save: function(name, getData){
    var self = this;

  },
  flush: async function(name){
    if (this.busy[name]) return;
    var get = this.pending[name];
    if (!get) return;
    delete this.pending[name];
    this.busy[name] = true;
    setSaveState();
    var data = clone(get());
    try {
      try { await this.write(name, data); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise(function(r){ setTimeout(r, 600 + Math.random() * 600); }); await this.write(name, data); }
        else throw e;
      }
    } catch (e) {
      if (!this.pending[name]) this.failed[name] = get;
    }
    this.busy[name] = false;
    if (this.pending[name]) this.flush(name);
    setSaveState();
  },
  retry: function(){
    var self = this;
    Object.keys(this.failed).forEach(function(n){ self.pending[n] = self.failed[n]; delete self.failed[n]; self.flush(n); });
  },
  quiet: function(){
    return !Object.keys(this.pending).length && !Object.keys(this.failed).length &&
      !Object.keys(this.busy).some(function(k){ return Store.busy[k]; });
  }
};

function setSaveState(){

  var working = Object.keys(Store.pending).length || Object.keys(Store.busy).some(function(k){ return Store.busy[k]; });
  S.saveState = failed ? 'failed' : (working ? 'saving' : 'saved');
  if (!el) return;

async function boot(){

  } catch (e) {
    S.error = 'Could not load your log.';
  }
  render();
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function(d){ S.downloads = d; }).catch(function(){});
  }
}
async function loadCore(){
  var got = await Promise.all([Store.load('settings'), Store.load('foods'), null, Store.load('batches')]);
  if (got[0]) {
    S.settings = Object.assign({ budget: null, meals: DEFAULT_MEALS.slice(), unit: 'lb' }, got[0]);
    if (!Array.isArray(S.settings.meals) || !S.settings.meals.length) S.settings.meals = DEFAULT_MEALS.slice();
    if (S.settings.meals.join('|') === OLD_MEALS.join('|')) { S.settings.meals = DEFAULT_MEALS.slice(); S.settings.remap5 = true; saveSettings(); }
  } else S.settings.remap5 = true;
  applyOvb();
  if (!S.cur) S.date = today();
  S.cur = today();
  S.foods = (got[1] && got[1].items) || {};
  var yNow = new Date().getFullYear() + 1, y0 = Math.min(Number(S.settings.wy0) || yNow, yNow), years = [], yy;
  for (yy = y0; yy <= yNow; yy++) years.push(Store.load('weights-' + yy));
  var wdocs = await Promise.all(years);
  S.weights = {};
  wdocs.forEach(function(d){ if (d && d.w) Object.keys(d.w).forEach(function(k){ S.weights[k] = d.w[k]; }); });
  S.batches = (got[3] && got[3].items) || {};
  S.pots = (got[3] && got[3].pots) || [];
  S.months = {};
  await Promise.all([loadMonth(ym(S.date)), loadMonth(ym(addDays(S.date, -1)))]);
  S.lastLoad = Date.now();
}
function followDay(){
  var t = today();

  if (S.date === S.cur) S.date = t;
  S.cur = t;
  return true;
}
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { Object.keys(Store.pending).forEach(function(n){ clearTimeout(Store.timers[n]); Store.flush(n); }); return; }
  if (!S.ready || S.sheet) return;
  var moved = followDay();
  if (Store.mode === 'cloud' && Store.quiet() && Date.now() - S.lastLoad >= 60000) {
    loadCore().then(function(){ followDay(); if (S.tab === 'trends') return ensureTrendMonths(); }).then(render).catch(function(){});
  } else if (moved) goDate(S.date);

/* Built-in USDA SR Legacy list: rows of [name, kcal, protein, carbs, fat, fiber, sugar, sodium mg, cholesterol mg, sat fat, serving g, serving name], per 100 g; -1 = not measured */
var USDA = null, USDA_L = null;
function usdaLoad(){
  if (USDA) return;
  try { USDA = JSON.parse(document.getElementById('usda').textContent); } catch (e) { USDA = []; }
  USDA_L = USDA.map(function(r){ return r[0].toLowerCase(); });
}
function usdaSearch(q){
  var words = q.toLowerCase().split(/\s+/).filter(Boolean), hits = [], i, j;
  if (q.trim().length < 2) return hits;
  usdaLoad();
  for (i = 0; i < USDA.length; i++) {
    var n = USDA_L[i], ok = true;
    for (j = 0; j < words.length; j++) if (n.indexOf(words[j]) < 0) { ok = false; break; }
    if (ok) hits.push(i);
  }
  hits.sort(function(a, b){ var A = USDA_L[a], B = USDA_L[b]; return (A.indexOf(words[0]) === 0 ? 0 : 1) - (B.indexOf(words[0]) === 0 ? 0 : 1) || A.length - B.length; });
  return hits.slice(0, 40);
}
function usdaFood(i){
  usdaLoad();
  var r = USDA[i], fd = { n: r[0], k: r[1], src: 'usda' }, nd = [];
  ['p', 'c', 'f', 'fi', 'su', 'na', 'ch', 'sf'].forEach(function(key, j){ var v = r[2 + j]; if (v < 0) { nd.push(key); if (j < 3) fd[key] = 0; } else if (v || j < 3) fd[key] = v; });
  if (r[10]) { fd.sv = r[10]; if (r[11]) fd.sn = r[11]; }
  if (nd.length) fd.nd = nd;
  return fd;
}
function foodLine(fd){ return (fd.br ? esc(fd.br) + ', ' : '') + 'Protein ' + r1(fd.p) + ', fiber ' + r1(fd.fi) + ', sugar ' + r1(fd.su) + ' per 100 ' + unitShort(fd.un); }
function foodList(q, act){
  var words = q.toLowerCase().split(/\s+/).filter(Boolean);
  var ids = Object.keys(S.foods).filter(function(id){
    var n = (S.foods[id].n + ' ' + (S.foods[id].br || '')).toLowerCase();
    return words.every(function(w){ return n.indexOf(w) >= 0; });
  });
  if (act === 'edit-food') ids.sort(function(a, b){ return S.foods[a].n.localeCompare(S.foods[b].n); });
  else ids.sort(function(a, b){ return (S.foods[b].u || 0) - (S.foods[a].u || 0) || S.foods[a].n.localeCompare(S.foods[b].n); });
  var hits = usdaSearch(q), h = '';
  if (!ids.length && !hits.length) return '<div class="empty">' + (q.trim() ? 'Nothing matches "' + esc(q) + '". Use New food to add it.' : 'No foods saved yet. Search to pick from the built-in USDA list, or add your own.') + '</div>';
  h += ids.map(function(id){

  }).join('');
  if (hits.length) h += '<div class="lsep">From the USDA list</div>' + hits.map(function(i){
    var fd = usdaFood(i);

  }).join('');
  return h;
}
function viewFoods(){

function weightChange(){

function weekDays(){

function dayGauge(k, bud){
  var C = 2 * Math.PI * 50, arc = C * 0.75, top = bud ? bud * 1.25 : (k || 1);

      Object.keys(Store.pending).forEach(function(n){ clearTimeout(Store.timers[n]); Store.flush(n); });
      var docs = await Store.loadAll();
      docs.settings = S.settings; docs.foods = { items: S.foods }; Object.keys(S.weights).forEach(function(d){ var n = 'weights-' + d.slice(0, 4); if (!docs[n] || !docs[n].fresh) docs[n] = { w: {}, fresh: 1 }; docs[n].w[d] = S.weights[d]; }); Object.keys(docs).forEach(function(n){ if (docs[n] && docs[n].fresh) delete docs[n].fresh; }); docs.batches = { items: S.batches, pots: S.pots };
      Object.keys(S.months).forEach(function(m){ if (Object.keys(S.months[m].days).length) docs['log-' + m] = S.months[m]; });
      var text = JSON.stringify({ app: 'tally', version: 1, exported: new Date().toISOString(), docs: docs }), name = 'tally-backup-' + ds(new Date());
      function done(){ S.settings.lb = ds(new Date()); saveSettings(); render(); toast('Backup made'); }
      if (S.downloads) {
        try { await S.downloads.save({ filename: name + '.json', data: text }); done(); return; }
        catch (e) { if (e && e.code === 'declined') return; }
      }
      if (STANDALONE && share && navigator.canShare) {
        var file = new File([text], name + '.txt', { type: 'text/plain' });
        if (navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: 'Tally backup' }); done(); } catch (e) {}
          return;
        }
      }
      if (STANDALONE) {
        var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        a.href = url; a.download = name + '.json'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); done(); return;
      }
      out.innerHTML = '<p class="hint">Downloads are not available here. Copy this text and keep it in a file ending in .json.</p><textarea class="in" rows="5" readonly style="font-size:12px;margin-top:8px" aria-label="Backup text"></textarea>';
      out.querySelector('textarea').value = text;
    } catch (e) { if (out) out.innerHTML = '<p class="hint" style="color:var(--over)">Could not read your log for the backup. Try again in a minute.</p>'; }
  },
  erase: function(){
    openSheet({ type: 'confirm', title: 'Erase everything', text: 'This removes every food, entry, batch, weigh-in and setting, and it cannot be undone.', yes: 'Erase everything',
      go: async function(){
        try {
          await Store.eraseAll();
          S.settings = { budget: null, meals: DEFAULT_MEALS.slice(), unit: 'lb' }; S.cur = null; S.calm = null; S.tab = 'today';
          S.sheet = null; $('#sheet').innerHTML = '';
          await boot(); toast('Everything erased');
        } catch (e) { closeSheet(); toast('Could not erase everything. Try again.'); }
      } });
  },
  'import': function(){ var f = $('#file'); f.value = ''; f.click(); }
};

async function goDate(d){
  S.date = d; render();
  try { await Promise.all([loadMonth(ym(d)), loadMonth(ym(addDays(d, -1)))]); } catch (e) {}
  if (S.date === d && !S.sheet) render();
}

async function restore(obj){
  var names = Object.keys(obj.docs).filter(function(n){ return /^(settings|foods|weights-\d{4}|batches|log-\d{4}-\d{2})$/.test(n) && obj.docs[n] && typeof obj.docs[n] === 'object'; });
  try {
    for (var i = 0; i < names.length; i++) await Store.write(names[i], obj.docs[names[i]]);
    S.sheet = null; $('#sheet').innerHTML = '';
    await boot(); toast('Backup restored');
  } catch (e) { closeSheet(); toast('Restore did not finish. Try again.'); }
}
$('#file').addEventListener('change', function(){
  var file = this.files && this.files[0]; if (!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    var obj = null;
    try { obj = JSON.parse(rd.result); } catch (e) {}
    if (!obj || obj.app !== 'tally' || !obj.docs || typeof obj.docs !== 'object') { toast('That file is not a Tally backup'); return; }
    openSheet({ type: 'confirm', title: 'Restore from backup', text: 'This replaces your foods, settings, weigh-ins and every month in the backup (made ' + String(obj.exported || '').slice(0, 10) + ') with what the file holds.', yes: 'Restore backup', go: function(){ restore(obj); } });
  };
  rd.readAsText(file);
});

/* ---------- events ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = A[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('input', function(ev){
  var el = ev.target, kind = el.dataset && el.dataset.in;
  if (kind === 'food-search') {
    if (!S.sheet) S.foodQuery = el.value;
    var list = $('#foodlist'); if (list) list.innerHTML = foodList(el.value, el.dataset.target);
  } else if (kind === 'grams') updatePreview();
  else if (kind === 'tdee' && S.sheet) { S.sheet[el.dataset.k] = el.value; updateTdee(); }
  else if (kind === 'b-name' && S.draft) S.draft.n = el.value;
  else if (kind === 'b-scale' && S.draft) { S.draft.scale = el.value; updateBatchCalc(); }
});
document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el.dataset && el.dataset.in === 'b-pot') { if (el.value === 'new') openSheet({ type: 'pot' }); else { S.draft.pot = Number(el.value); updateBatchCalc(); } return; }
  if (el.dataset && el.dataset.in === 'diet-start') { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { S.settings.start = el.value; saveSettings(); render(); } return; }
  if (el.dataset && el.dataset.in === 'tdee' && S.sheet) { S.sheet[el.dataset.k] = el.value; updateTdee(); return; }
  if (el.dataset && el.dataset.in === 'roll') { S.settings.roll = Number(el.value); saveSettings(); S.cur = today(); goDate(S.cur); return; }
  if (el.dataset && el.dataset.in === 'unit') { S.sheet.qu = el.value; updatePreview(); return; }
  if (el.dataset && el.dataset.in === 'pick-date') { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) goDate(el.value); return; }
  if (el.dataset && el.dataset.in === 'meal-name') {
    var v = el.value.trim(), i = Number(el.dataset.i);
    if (!v) { el.value = S.settings.meals[i]; return; }
    S.settings.meals[i] = v; saveSettings();
  }
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && S.sheet) { if (S.draft && S.sheet.type !== 'batch') openSheet({ type: 'batch' }); else if (S.draft) A['leave-batch'](); else closeSheet(); return; }
  if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
  var map = { grams: S.sheet && S.sheet.type === 'entry' ? 'save-entry' : 'confirm-add', 'qa-k': S.sheet && S.sheet.type === 'entry' ? 'save-entry' : 'confirm-quick', 'qa-n': 'confirm-quick', 'budget-in': 'save-budget', 'bd-in': 'save-day-budget', 'maint-in': 'save-maint', 'w-in': 'log-weight', 'ex-in': 'save-exercise', 'ws-in': 'save-weight' };
  var act = map[ev.target.id];
  if (act && A[act]) { ev.preventDefault(); A[act](ev.target); }
});

if (STANDALONE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
boot();
})();
</script>
</body>
</html>
